name: Go CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Run Tests
        working-directory: BGP
        run: go test -v ./...

      - name: Build
        working-directory: BGP
        run: go build ./...

